<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Círculo externo alquímico -->
  <circle cx="40" cy="40" r="35" stroke="#8E6620" stroke-width="1.8"/>
  <circle cx="40" cy="40" r="31" stroke="#D9A94B" stroke-width="1" opacity="0.6"/>
  <!-- Triângulo superior (Fogo / Céu) -->
  <polygon points="40,12 66,56 14,56" stroke="#8E6620" stroke-width="2" fill="rgba(217,169,75,0.05)"/>
  <!-- Triângulo inferior (Água / Terra) -->
  <polygon points="40,68 66,24 14,24" stroke="#D9A94B" stroke-width="2" fill="rgba(142,102,32,0.05)"/>
  <!-- Ponto central de união hermética (O Elo) -->
  <circle cx="40" cy="40" r="4" stroke="#8E6620" stroke-width="1.8" fill="#F4EFE6"/>
  <circle cx="40" cy="40" r="1.5" fill="#8E6620"/>
</svg>
